<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boğaz Kapışması</title>
<style>
:root{--ink:#1c1238;--dusk:#2b1b4d;--gold:#ffb23c;--paper:#fbf3ff;--teal:#1fb5a6}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
 background:var(--ink);color:var(--paper);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
 padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));-webkit-user-select:none;user-select:none}
.stage{position:relative;width:min(98vw,calc((100dvh - 150px)*16/9),1100px);aspect-ratio:16/9;border-radius:12px;overflow:hidden;
 box-shadow:0 0 0 3px var(--gold),0 10px 40px rgba(0,0,0,.5)}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
 text-align:center;padding:20px;background:rgba(28,18,56,.9)}
.ov[hidden]{display:none}
.ov h1{margin:0;font-size:clamp(1.8rem,5vw,3rem);font-weight:800}
.ov p{margin:0;max-width:58ch;line-height:1.55;font-size:clamp(.66rem,1.55vw,.9rem)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;cursor:pointer}
.main{font-weight:700;padding:11px 24px;border:0;border-radius:999px;background:var(--gold);color:var(--ink)}
.alt{font-weight:700;padding:11px 24px;border:2px solid var(--gold);border-radius:999px;background:transparent;color:var(--gold)}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.touch{display:none;width:min(98vw,1100px);justify-content:space-between;align-items:center;touch-action:none}
.touch .g{display:grid;gap:8px}
.touch .l{grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px)}
.touch .r{grid-template-columns:repeat(2,78px);grid-auto-rows:58px}
.touch button{border:0;border-radius:14px;background:#3a2766;color:var(--paper);font-size:1rem;font-weight:700;touch-action:none}
.touch button:active,.touch button.on{background:var(--teal)}
.touch .u{grid-column:2}.touch .a{grid-row:2;grid-column:1}.touch .d{grid-row:2;grid-column:2}.touch .b{grid-row:2;grid-column:3}
@media (pointer:coarse){.touch{display:flex}.hint{display:none}}
.hint{margin:0;font-size:.8rem;opacity:.65}
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv" width="960" height="540" role="img" aria-label="Dövüş sahnesi"></canvas>
  <div class="ov" id="ov" aria-live="polite"></div>
</div>
<div class="touch">
  <div class="g l">
    <button class="u" data-k="KeyW" aria-label="Zıpla">▲</button>
    <button class="a" data-k="KeyA" aria-label="Sola">◀</button>
    <button class="d" data-k="KeyS" aria-label="Siper">Siper</button>
    <button class="b" data-k="KeyD" aria-label="Sağa">▶</button>
  </div>
  <div class="g r">
    <button data-k="KeyF">Yumruk</button><button data-k="KeyG">Tekme</button><button data-k="KeyH">Özel</button><button data-k="KeyT">Tutuş</button>
  </div>
</div>
<p class="hint">P veya Esc: duraklat</p>

<script>
(() => {
const W=960,H=540,GR=450,cv=document.getElementById('cv'),g=cv.getContext('2d'),ov=document.getElementById('ov');
const K1={l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',p:'KeyF',k:'KeyG',s:'KeyH',t:'KeyT'};
const K2={l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',p:'Comma',k:'Period',s:'Slash',t:'KeyL'};
const A={p:{k:'p',st:4,ac:4,rc:9,dmg:6,reach:68,kb:6,stun:13},
         k:{k:'k',st:8,ac:5,rc:13,dmg:11,reach:98,kb:11,stun:19},
         s:{k:'s',st:12,ac:1,rc:20,proj:1},
         g:{k:'g',st:5,ac:3,rc:16,grab:1,reach:60},
         h:{k:'h',st:9,ac:10,rc:22,shoot:1,reach:66}};
const keys={};let mode='cpu',state='menu',st=0,round=1,wins=[0,0],tleft=3600,msg='',hitstop=0,shake=0,paused=false;
let balls=[],parts=[],pops=[],P=[],ac;
function pop(x,y,t){pops.push({x,y,t,l:55})}
function fx(){parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.l--});parts=parts.filter(p=>p.l>0);pops.forEach(p=>{p.y-=.8;p.l--});pops=pops.filter(p=>p.l>0)}

function sfx(f,d,t='square',v=.05){try{ac=ac||new AudioContext();const o=ac.createOscillator(),n=ac.createGain(),T=ac.currentTime;
 o.type=t;o.frequency.setValueAtTime(f,T);o.frequency.exponentialRampToValueAtTime(40,T+d);n.gain.setValueAtTime(v,T);
 n.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(n).connect(ac.destination);o.start();o.stop(T+d)}catch(e){}}
function spark(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*10,vy:(Math.random()-.8)*8,l:20+Math.random()*10,c})}

class F{
 constructor(i,name,col,col2,pants){Object.assign(this,{i,name,col,col2,pants});this.reset()}
 reset(){Object.assign(this,{x:this.i?680:280,y:GR,vx:0,vy:0,face:this.i?-1:1,hp:100,shown:100,en:0,
  s:'idle',stun:0,atk:null,at:0,done:0,t:0,ko:0,prev:{},plan:'idle',pt:0,inv:0,dn:0,cl:null})}
 go(a){this.atk=a;this.at=0;this.done=0;this.s='atk';if(this.y>=GR)this.vx=0;sfx(a.k==='k'?240:320,.08,'sawtooth',.03)}
 hit(from,dir,dmg,kb,stun){
  if(this.inv>0||this.s==='ko')return;
  if(this.s==='down'){this.hp-=Math.ceil(dmg*.6);from.en=Math.min(100,from.en+5);spark(this.x,this.y-30,'#ffb23c',8);sfx(120,.1,'sawtooth',.06);hitstop=3;if(this.hp<=0)this.die(dir);return}
  const b=this.s==='block'&&this.face===-dir;
  if(b){this.hp-=Math.ceil(dmg*.15);this.vx=dir*kb*.6;this.stun=8;spark(this.x-dir*20,this.y-90,'#7fd4ff',6);sfx(150,.1,'square',.05);hitstop=3}
  else{this.hp-=dmg;this.vx=dir*kb;this.stun=stun;this.s='hit';this.atk=null;this.en=Math.min(100,this.en+6);
   from.en=Math.min(100,from.en+9);spark(this.x,this.y-90,'#ffb23c',12);sfx(110,.15,'sawtooth',.08);hitstop=5;shake=dmg>10?10:6}
  if(this.hp<=0)this.die(dir);
 }
 die(dir){this.hp=0;this.s='ko';this.ko=0;this.vy=-9;this.vx=dir*6;this.stun=0;this.atk=null;this.cl=null;shake=16;hitstop=12;sfx(70,.5,'sawtooth',.1)}
 tryGrab(o,a){
  const dx=(o.x-this.x)*this.face;
  if(!(dx>-10&&dx<a.reach+20&&Math.abs(o.y-this.y)<40)||['ko','down','clinch'].includes(o.s)||o.inv>0)return;
  this.done=1;
  if(a.grab){this.cl={ctrl:1,t:0,cd:12,an:0,type:''};o.cl={ctrl:0,t:0,cd:0,an:0};this.s=o.s='clinch';this.atk=o.atk=null;this.stun=o.stun=0;this.vx=o.vx=0;
   pop(this.x+this.face*30,this.y-150,'Tutuş!');sfx(200,.15,'triangle',.06);hitstop=4;return}
  if(o.s==='block'){this.atk=null;this.s='stuff';this.stun=36;this.vx=-this.face*3;o.en=Math.min(100,o.en+10);
   pop(o.x,o.y-150,'Savunma!');spark(o.x,o.y-40,'#7fd4ff',10);sfx(160,.15,'square',.06);hitstop=5;return}
  this.atk=null;this.s='idle';this.stun=12;this.vx=0;this.en=Math.min(100,this.en+12);
  o.s='down';o.dn=55;o.atk=null;o.stun=0;o.vx=this.face*4;o.hp-=8;
  pop(o.x,o.y-150,'Yere indirme!');spark(o.x,o.y-20,'#ffb23c',12);sfx(90,.25,'sawtooth',.09);shake=9;hitstop=6;if(o.hp<=0)o.die(this.face)
 }
 cs(o,dmg,type){
  const cl=this.cl;cl.cd=18;cl.an=12;cl.type=type;o.hp-=dmg;
  spark(o.x,o.y-90,'#ffb23c',8);sfx(120,.1,'sawtooth',.07);hitstop=3;shake=5;
  this.en=Math.min(100,this.en+7);o.en=Math.min(100,o.en+4);if(o.hp<=0)o.die(this.face)
 }
 cstep(o,c,pr){
  const cl=this.cl;
  if(!cl||o.s!=='clinch'){this.s='idle';this.cl=null;return}
  cl.t++;this.vx=0;this.vy=0;this.y=GR;if(cl.cd>0)cl.cd--;if(cl.an>0)cl.an--;
  if(cl.ctrl){
   o.x=this.x+this.face*44;o.y=GR;o.vx=o.vy=0;o.face=-this.face;
   if(cl.t>140){this.s=o.s='idle';this.cl=o.cl=null;this.vx=-this.face*3;o.vx=this.face*3;return}
   if(cl.cd<=0){
    if(pr('t')){o.s='down';o.dn=55;o.cl=null;o.hp-=14;o.x=this.x+this.face*80;o.vx=this.face*3;
     this.cl=null;this.s='idle';this.stun=14;this.en=Math.min(100,this.en+10);
     pop(o.x,o.y-150,'Yere indirme!');spark(o.x,o.y-20,'#ffb23c',14);sfx(90,.25,'sawtooth',.09);shake=8;hitstop=6;if(o.hp<=0)o.die(this.face)}
    else if(pr('k'))this.cs(o,10,'knee');
    else if(pr('p'))this.cs(o,5,'elbow');
   }
  }else if(pr('t')&&cl.cd<=0){
   cl.cd=30;
   if(Math.random()<.55){this.s=o.s='idle';this.cl=o.cl=null;this.vx=-this.face*7;o.vx=this.face*5;o.stun=18;this.stun=8;
    this.en=Math.min(100,this.en+8);pop(this.x,this.y-150,'Çıkış!');sfx(260,.12,'triangle',.06)}
   else pop(this.x,this.y-150,'Kilit!')
  }
 }
 step(o,c){
  this.t++;const gd=this.y>=GR,pr=k=>c[k]&&!this.prev[k];
  if(this.inv>0)this.inv--;
  if(this.s==='down'){if(--this.dn<=0){this.s='idle';this.inv=22}this.vx*=.9}
  else if(this.s==='clinch')this.cstep(o,c,pr);
  else if(this.s==='ko'){this.ko++;if(gd)this.vx*=.93}
  else if(this.stun>0){if(--this.stun===0)this.s='idle';this.vx*=.88}
  else if(this.atk){
   const a=this.atk;this.at++;if(a.shoot)this.vx=(this.at>=a.st&&this.at<a.st+a.ac&&!this.done)?this.face*9:0;
   if(this.at>=a.st&&this.at<a.st+a.ac&&!this.done){
    if(a.proj){this.done=1;balls.push({x:this.x+this.face*50,y:GR-85,d:this.face,own:this,t:0});sfx(520,.25,'triangle',.05)}
    else if(a.grab||a.shoot)this.tryGrab(o,a);
    else{const dx=(o.x-this.x)*this.face;if(dx>-10&&dx<a.reach+20&&Math.abs(o.y-this.y)<80&&o.s!=='ko'){this.done=1;o.hit(this,this.face,a.dmg,a.kb,a.stun)}}
   }
   if(this.at>=a.st+a.ac+a.rc){this.atk=null;this.s=gd?'idle':'air'}
  }else{
   if(c.d&&gd){this.s='block';this.vx=0}
   else{
    this.s=gd?'idle':'air';const m=(c.r?1:0)-(c.l?1:0);
    if(gd){this.vx=m*4.2;if(m)this.s='walk';if(c.u){this.vy=-15;this.s='air'}}
    if(pr('p'))this.go(A.p);else if(pr('k'))this.go(A.k);else if(pr('s')&&this.en>=50&&gd){this.en-=50;this.go(A.s)}
    else if(pr('t')&&gd)this.go(Math.abs(o.x-this.x)<95?A.g:A.h);
   }
  }
  this.prev={...c};
  if(!this.atk&&this.stun<=0&&gd&&!['ko','clinch','down'].includes(this.s))this.face=o.x>this.x?1:-1;
  this.x+=this.vx;this.vy+=.8;this.y+=this.vy;
  if(this.y>=GR){this.y=GR;this.vy=0;if(this.s==='air')this.s='idle'}
  this.x=Math.max(40,Math.min(W-40,this.x));
  if(Math.abs(this.x-o.x)<44&&Math.abs(this.y-o.y)<60&&!['ko','clinch','down'].includes(this.s)&&!['clinch','down'].includes(o.s))this.x+=(this.x<o.x?-1:1)*2.5;
  this.shown+=(this.hp-this.shown)*.07;
 }
}

function limb(a,b,c,d,w,col){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()}
function drawF(f){
 g.save();if(f.inv>0&&f.t%4<2)g.globalAlpha=.5;g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(f.x,GR+4,Math.max(12,34-(GR-f.y)/6),8,0,0,7);g.fill();
 g.translate(f.x,f.y);g.scale(f.face,1);g.lineCap='round';
 const s=f.s,t=f.t,skin='#f0c9a0',bob=Math.sin(t/8)*1.5;
 let lean=0,hy=-58,fa=[18,-100],ba=[-12,-92],ff=[16,0],bf=[-16,0];
 if(s==='walk'){const w=Math.sin(t/4)*16;ff=[w,0];bf=[-w,0]}
 if(s==='air'){ff=[18,-24];bf=[-12,-34]}
 if(s==='block'){fa=[28,-114];ba=[22,-100];hy=-50}
 if(s==='hit'){lean=-12;fa=[-10,-84];ba=[-26,-90]}
 if(s==='ko'){g.translate(0,-10);g.rotate(-Math.min(f.ko/16,1)*Math.PI/2.1);fa=[-6,-90];ba=[-20,-80];ff=[8,0];bf=[-8,0]}
 if(s==='down'){const p=f.dn>45?(55-f.dn)/10:f.dn<10?f.dn/10:1;g.translate(0,-10*p);g.rotate(-p*Math.PI/2.1);fa=[-6,-90];ba=[-20,-80];ff=[8,0];bf=[-8,0]}
 if(s==='stuff'){lean=26;hy=-34;fa=[34,-38];ba=[24,-30];ff=[-6,0];bf=[-26,0]}
 if(s==='clinch'&&f.cl){const c=f.cl;if(c.ctrl){lean=10;fa=[34,-108];ba=[30,-96];if(c.an>0){if(c.type==='knee')ff=[24,-52];else fa=[42,-112]}}else{lean=6;hy=-52;fa=[26,-100];ba=[20,-90]}}
 if(f.atk){const a=f.atk,p=f.at,e=p<a.st?p/a.st:p<a.st+a.ac?1:Math.max(0,1-(p-a.st-a.ac)/a.rc);
  if(a.k==='p'){fa=[18+60*e,-104];lean=6*e}
  if(a.k==='k'){ff=[20+72*e,-54*e];lean=-8*e}
  if(a.k==='s'){fa=[24+36*e,-100];ba=[16+32*e,-96];lean=8*e}
  if(a.k==='g'){fa=[30+10*e,-104];ba=[26+10*e,-96];lean=8*e}
  if(a.k==='h'){lean=26*e;hy=-58+22*e;fa=[34+12*e,-62];ba=[28+12*e,-54];ff=[26,0];bf=[-20,0]}}
 const hx=lean*.3,sx=lean,sy=-100+bob,hdx=lean*1.2,hdy=-124+bob;
 limb(hx,hy+bob,bf[0],bf[1],15,f.pants);limb(sx,sy,ba[0]+lean*.5,ba[1]+bob,12,skin);
 limb(hx,hy+bob,sx,sy,30,f.col);limb(hx,hy+bob,hx,hy+bob+12,31,f.pants);
 g.fillStyle=skin;g.beginPath();g.arc(hdx,hdy,14,0,7);g.fill();
 g.strokeStyle=f.col2;g.lineWidth=5;g.beginPath();g.moveTo(hdx-14,hdy-5);g.lineTo(hdx+14,hdy-5);g.stroke();
 g.fillStyle='#1c1238';g.beginPath();g.arc(hdx+6,hdy,2.4,0,7);g.fill();
 limb(hx,hy+bob,ff[0],ff[1],15,f.pants);g.fillStyle=f.col2;g.beginPath();g.arc(ff[0]+3,ff[1]-2,8,0,7);g.fill();
 limb(sx,sy,fa[0]+lean*.5,fa[1]+bob,13,skin);g.fillStyle=f.col2;g.beginPath();g.arc(fa[0]+lean*.5,fa[1]+bob,8.5,0,7);g.fill();
 g.restore();
}

// arka plan (bir kez çizilir)
const BG=document.createElement('canvas');BG.width=W;BG.height=H;
(function(){const b=BG.getContext('2d');let gr=b.createLinearGradient(0,0,0,340);
 gr.addColorStop(0,'#241545');gr.addColorStop(.55,'#b8447a');gr.addColorStop(1,'#ff9a4d');b.fillStyle=gr;b.fillRect(0,0,W,H);
 b.fillStyle='rgba(255,226,150,.9)';b.beginPath();b.arc(690,290,58,0,7);b.fill();
 b.fillStyle='#3a2358';
 for(let x=0;x<W;x+=26){const h=40+Math.abs(Math.sin(x*.37)*34);b.fillRect(x,330-h,24,h)}
 function mosque(cx,s){b.fillStyle='#2a1848';b.beginPath();b.arc(cx,330-30*s,60*s,Math.PI,0);b.fill();b.fillRect(cx-60*s,330-30*s,120*s,30*s);
  for(const m of[-1,1]){const mx=cx+m*82*s;b.fillRect(mx-5*s,330-150*s,10*s,150*s);b.beginPath();b.moveTo(mx-7*s,330-150*s);b.lineTo(mx,330-182*s);b.lineTo(mx+7*s,330-150*s);b.fill()}}
 mosque(270,1.1);mosque(800,.8);
 gr=b.createLinearGradient(0,330,0,440);gr.addColorStop(0,'#2c7a9a');gr.addColorStop(1,'#123a5c');b.fillStyle=gr;b.fillRect(0,330,W,110);
 b.fillStyle='#4a2c3a';b.fillRect(0,440,W,100);b.fillStyle='#5c3a46';
 for(let y=440;y<H;y+=22){b.fillRect(0,y,W,2)}
 b.fillStyle='#ffb23c';b.fillRect(0,438,W,4);
})();

function hud(){
 const bw=370;
 [[40,P[0],0],[W-40-bw,P[1],1]].forEach(([x,f,r])=>{
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(x,22,bw,24);
  g.fillStyle='#ffb23c';let w=bw*f.shown/100;g.fillRect(r?x+bw-w:x,22,w,24);
  g.fillStyle=f.hp>30?'#53e08f':'#ff5b4a';w=bw*f.hp/100;g.fillRect(r?x+bw-w:x,22,w,24);
  g.fillStyle='rgba(0,0,0,.5)';g.fillRect(x,50,bw*.6,9);g.fillStyle=f.en>=50?'#ffe27a':'#6cc9ff';
  w=bw*.6*f.en/100;g.fillRect(r?x+bw-bw*.6*1+(bw*.6-w):x,50,w,9);
  g.fillStyle='#fbf3ff';g.font='700 17px "Trebuchet MS",system-ui';g.textAlign=r?'right':'left';
  g.fillText(f.name+(r&&mode==='cpu'?' (bilgisayar)':''),r?x+bw:x,78);
  for(let i=0;i<2;i++){g.fillStyle=i<wins[f.i]?'#ffb23c':'rgba(255,255,255,.25)';g.beginPath();
   g.arc(r?x+bw-8-i*20:x+8+i*20,92,6,0,7);g.fill()}
 });
 g.fillStyle='#fbf3ff';g.textAlign='center';g.font='800 40px "Trebuchet MS",system-ui';g.fillText(Math.max(0,Math.ceil(tleft/60)),W/2,50);
}
function banner(){
 let t='';
 if(state==='intro')t=st<70?'Raund '+round:'Dövüş!';else if(state==='rend')t=msg;
 if(paused)t='Duraklatıldı';
 if(!t)return;
 const sc=1+Math.max(0,(12-st%70)/40);
 g.save();g.translate(W/2,230);g.scale(sc,sc);g.textAlign='center';g.font='800 78px "Trebuchet MS",system-ui';
 g.lineWidth=10;g.strokeStyle='#1c1238';g.strokeText(t,0,0);g.fillStyle='#ffb23c';g.fillText(t,0,0);g.restore();
}
function render(){
 g.save();if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;if(shake<.5)shake=0}
 g.drawImage(BG,0,0);
 g.fillStyle='rgba(255,226,150,.25)';const tm=Date.now()/400;
 for(let i=0;i<6;i++)g.fillRect(660+Math.sin(tm+i)*14,350+i*14,60-i*6,3);
 P.forEach(drawF);
 balls.forEach(b=>{const r=g.createRadialGradient(b.x,b.y,2,b.x,b.y,30);r.addColorStop(0,'#fff');r.addColorStop(.4,b.own.col2);r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.beginPath();g.arc(b.x,b.y,30,0,7);g.fill()});
 parts.forEach(p=>{g.fillStyle=p.c;g.globalAlpha=Math.min(1,p.l/12);g.fillRect(p.x,p.y,5,5)});g.globalAlpha=1;
 pops.forEach(p=>{g.globalAlpha=Math.min(1,p.l/15);g.font='800 26px "Trebuchet MS",system-ui';g.textAlign='center';g.lineWidth=6;g.strokeStyle='#1c1238';g.strokeText(p.t,p.x,p.y);g.fillStyle='#ffe27a';g.fillText(p.t,p.x,p.y)});g.globalAlpha=1;
 g.restore();hud();banner();
}

function ai(f,o){
 const c={},d=Math.abs(o.x-f.x),to=o.x>f.x?'r':'l',aw=to==='r'?'l':'r';
 if(f.s==='clinch'&&f.cl){if(f.cl.ctrl){if(f.t%11===0){const r=Math.random();if(r<.4)c.k=1;else if(r<.7)c.p=1;else c.t=1}}else c.t=f.t%9===0;return c}
 if(o.atk&&o.atk.shoot&&o.at===2&&d<240&&Math.random()<.65){f.plan='block';f.pt=24}
 if(--f.pt<=0){f.pt=10+Math.random()*14|0;const r=Math.random();
  if(o.atk&&d<140&&r<.55)f.plan='block';
  else if(d>170)f.plan=(f.en>=50&&r<.35&&d>230)?'fire':(r<.12?'jump':'approach');
  else if(d>=100&&r<.22)f.plan='shoot';
  else f.plan=d<90&&r<.25?'clinch':r<.5?'attack':r<.68?'retreat':r<.82?'block':'idle'}
 switch(f.plan){
  case'approach':c[to]=1;break;case'retreat':c[aw]=1;break;case'block':c.d=1;break;
  case'jump':c[to]=1;c.u=1;f.plan='approach';break;case'fire':c.s=f.t%6<1;break;
  case'attack':if(d>95)c[to]=1;else c[Math.random()<.6?'p':'k']=f.t%7===0;break;case'shoot':case'clinch':c.t=f.t%5===0;break}
 return c;
}
function inpOf(i){
 if(i===1&&mode==='cpu')return ai(P[1],P[0]);
 const m=i?K2:K1,c={};for(const k in m)c[k]=!!keys[m[k]]||(i===0&&mode==='cpu'&&!!keys[K2[k]]);return c;
}

function startRound(){P.forEach(f=>f.reset());balls=[];parts=[];pops=[];tleft=3600;state='intro';st=0;sfx(300,.3,'triangle',.06)}
function startMatch(m){mode=m;wins=[0,0];round=1;ov.hidden=true;startRound()}
function endRound(why){
 let w=P[0].hp>P[1].hp?0:P[1].hp>P[0].hp?1:-1;if(w>=0)wins[w]++;
 msg=w<0?'Berabere':why==='ko'?'K.O.!':'Süre doldu';state='rend';st=0;
}
function showOv(t,p,btns){ov.innerHTML='';const h=document.createElement('h1');h.textContent=t;ov.appendChild(h);
 const pp=document.createElement('p');pp.innerHTML=p;ov.appendChild(pp);
 const d=document.createElement('div');d.className='btns';
 btns.forEach(([l,fn,c],i)=>{const b=document.createElement('button');b.className=c||'main';b.textContent=l;b.onclick=fn;d.appendChild(b);if(!i)setTimeout(()=>b.focus(),0)});
 ov.appendChild(d);ov.hidden=false}
function menu(){state='menu';showOv('Boğaz Kapışması',
 '2 raundu alan kazanır. Enerjin yarıdan fazlaysa ateş topu atabilirsin. <b>Yakında T</b> rakibi klinçe alır: tutan G ile diz, F ile dirsek, T ile yere indirme yapar; tutulan T ile çıkmayı dener. <b>Uzaktan T</b> şut (takedown) atar. Şuta karşı siper (S) sprawl savunmasıdır, havadaki rakibe şut ıskalar. Yerdeki rakibe vurabilirsin.<br>'+
 '<b>1. oyuncu:</b> A/D yürü, W zıpla, S siper, F yumruk, G tekme, H özel, T tutuş/şut.<br>'+
 '<b>2. oyuncu:</b> Ok tuşları (yukarı zıpla, aşağı siper), virgül yumruk, nokta tekme, eğik çizgi özel, L tutuş/şut.',
 [['Bilgisayara karşı',()=>startMatch('cpu')],['İki oyuncu',()=>startMatch('pvp'),'alt']])}
function finish(){state='over';const w=wins[0]>wins[1]?P[0]:P[1];
 showOv(w.name+' kazandı!','Raund skoru '+wins[0]+' - '+wins[1]+'.',[['Tekrar oyna',()=>startMatch(mode)],['Menü',menu,'alt']])}

function update(){
 if(paused||state==='menu'||state==='over'){fx();return}
 st++;
 if(hitstop>0){hitstop--;return}
 if(state==='intro'&&st>110){state='fight';st=0}
 if(state==='fight'||state==='rend'){
  const f=state==='fight';
  P[0].step(P[1],f?inpOf(0):{});P[1].step(P[0],f?inpOf(1):{});
  balls=balls.filter(b=>{b.x+=9*b.d;b.t++;const o=b.own===P[0]?P[1]:P[0];
   if(o.s!=='ko'&&Math.abs(b.x-o.x)<34&&Math.abs(b.y-(o.y-70))<65){o.hit(b.own,b.d,15,9,17);return false}
   return b.x>-40&&b.x<W+40});
  for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++)
   if(balls[i].d!==balls[j].d&&Math.abs(balls[i].x-balls[j].x)<30){spark(balls[i].x,balls[i].y,'#fff',14);balls[i].x=balls[j].x=-999;sfx(400,.2,'square',.05)}
  if(f){tleft--;if(P[0].hp<=0||P[1].hp<=0)endRound('ko');else if(tleft<=0)endRound('time')}
  else if(st>170){if(wins[0]>=2||wins[1]>=2)finish();else{round++;startRound()}}
 }
 fx();
}

let last=performance.now(),acc=0;
function loop(n){acc+=Math.min(100,n-last);last=n;while(acc>=1000/60){update();acc-=1000/60}render();requestAnimationFrame(loop)}

P=[new F(0,'Kaplan','#e8452f','#ffb23c','#3b1f2b'),new F(1,'Deniz','#1fb5a6','#fbf3ff','#132a4a')];
const used=new Set([...Object.values(K1),...Object.values(K2)]);
addEventListener('keydown',e=>{
 if(used.has(e.code)){e.preventDefault()}
 keys[e.code]=true;
 if((e.code==='KeyP'||e.code==='Escape')&&(state==='fight'||state==='intro'||state==='rend'))paused=!paused;
});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='fight')paused=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='fight')paused=true});
document.querySelectorAll('.touch button').forEach(b=>{
 const on=v=>e=>{e.preventDefault();keys[b.dataset.k]=v;b.classList.toggle('on',v);if(v&&paused)paused=false};
 b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);on(true)(e)});
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,on(false)));
});
cv.addEventListener('pointerdown',()=>{if(paused)paused=false});

menu();requestAnimationFrame(loop);
})();
</script>
